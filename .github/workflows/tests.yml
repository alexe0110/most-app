name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (empty = the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

# In a called workflow github.workflow is the caller's name, so the suffix keeps
# Tests and Linters from cancelling each other inside one deploy run.
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run unit tests
        run: go test -race ./...

  integration_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: make test-int

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check sqlc output is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code
