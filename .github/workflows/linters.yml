name: Linters

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (empty = the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

# In a called workflow github.workflow is the caller's name, so the suffix keeps
# Tests and Linters from cancelling each other inside one deploy run.
concurrency:
  group: ${{ github.workflow }}-linters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # build the linter with the project's Go so it understands go.mod's version
          install-mode: goinstall
