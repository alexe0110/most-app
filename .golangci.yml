version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - misspell
    - revive
    - bodyclose
    - noctx
    - unused
    - unparam
  exclusions:
    rules:
      # The fakes implement ports documented in ports.go; per-method comments would only repeat them.
      - path: internal/docsbot/docsbottest/
        linters:
          - revive
        text: "exported"
  settings:
    depguard:
      rules:
        domain:
          list-mode: lax
          files:
            - "**/internal/docsbot/*.go"
          allow:
            - github.com/alexe0110/most-app/internal/docsbot/docsbottest # test fakes, guarded by the docsbottest rule
          deny:
            - pkg: github.com/alexe0110/most-app/internal/docsbot/
              desc: "domain must not import its adapters"
            - pkg: github.com/alexe0110/most-app/internal/platform/tg
              desc: "domain must not depend on Telegram"
            - pkg: github.com/alexe0110/most-app/internal/platform/db
              desc: "domain must not depend on the database"
            - pkg: github.com/alexe0110/most-app/internal/platform/gdrive
              desc: "domain must not depend on Google Drive"
        jobs:
          list-mode: lax
          files:
            - "**/internal/docsbot/jobs/**"
            - "!$test"
          deny:
            - pkg: github.com/alexe0110/most-app/internal/docsbot/postgres
              desc: "jobs must not import postgres adapter; use a consumer port"
        postgres:
          list-mode: lax
          files:
            - "**/internal/docsbot/postgres/**"
            - "!$test"
          deny:
            - pkg: github.com/alexe0110/most-app/internal/docsbot/jobs
              desc: "postgres must not import jobs adapter"
        docsbottest:
          list-mode: lax
          files:
            - "**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/alexe0110/most-app/internal/docsbot/docsbottest
              desc: "docsbottest holds test fakes; import it from _test.go files only"
        platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/alexe0110/most-app/internal/docsbot
              desc: "platform must not import bots"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alexe0110/most-app